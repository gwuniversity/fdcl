{% assign card_post = include.post %}
          <div class="article">
            <div class="article__inner">

              <div class="article__head">
                {% if card_post.image %}{% if card_post.video_embed or card_post.video %}
                <div class="video-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
                    <polygon points="40,30 70,50 40,70"></polygon>
                  </svg>
                </div>
                {% endif %}{% endif %}

                {% if card_post.image %}
                <a href="{{ card_post.url | relative_url }}" class="article__image{% if card_post.image_fit == 'contain' %} article__image--contain{% endif %}" aria-hidden="true" tabindex="-1">
                  <img src="{{ card_post.thumbnail | default: card_post.image | relative_url }}" loading="lazy" alt="{{ card_post.thumbnail_alt | default: card_post.image_alt | default: card_post.title | escape }}">
                </a>
                {% endif %}
              </div>

              <div class="article__content">
                <{{ include.heading | default: "h2" }} class="article__title">
                  <a href="{{ card_post.url | relative_url }}">{{ card_post.title }}</a>
                </{{ include.heading | default: "h2" }}>
              </div>

            </div>
          </div>
