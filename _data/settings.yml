#-------------------------------
# About Section Settings
about:
  enable: true
  about_title: About FDCL
  about_subtitle: From geometric foundations to autonomous flight.
  about_description: |
    At FDCL, we study how geometry can help autonomous systems move, perceive, and make decisions. Our research brings together differential geometry and applied mathematics with control, estimation, optimization, and artificial intelligence.

    We connect mathematical theory, computational methods, and experimental validation. Our applications range from spacecraft dynamics and bioinspired flight to cooperative aerial robotics and autonomous maritime landing, with UAV experiments providing a direct link between our methods and physical systems.

    Led by Dr. Taeyoung Lee, Professor of Mechanical and Aerospace Engineering at The George Washington University, we value curiosity, rigorous analysis, and clear communication.

  # about_image: images/Lee.png
  # about_image_alt: Taeyoung Lee
  about_button_text: Meet our team
  about_button_link: "/members/"
  about_videos:

    - video: /videos/inv_pend.mp4
      poster: /images/video-posters/inv_pend.jpg
      caption: Quadrotor balancing a flying inverted pendulum
    - video: /videos/flip.mp4
      poster: /images/video-posters/flip.jpg
      caption: Quadrotor flip maneuver
    - video: /videos/ship_landing.mov
      poster: /images/video-posters/ship_landing.jpg
      caption: Autonomous launch and recovery in ocean environment
    - video: /videos/monarch.mp4
      poster: /images/video-posters/monarch.jpg
      caption: Bioinspired flapping-wing flight control
    - video: /videos/kw41999.mp4
      poster: /images/video-posters/kw41999.jpg
      caption: Binary asteroid dynamics simulation
    - video: /videos/vision_in_loop.mp4
      poster: /images/video-posters/vision_in_loop.jpg
      caption: Vision-in-the-loop validation for maritime landing
    - video: /videos/revise-mapping.mp4
      poster: /images/video-posters/revise-mapping.jpg
      caption: Online, open-vocabulary 3D SLAM

